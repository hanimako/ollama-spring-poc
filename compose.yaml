services:
  mysql:
    image: mysql:8.4
    container_name: ollama-poc-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ollama_poc
      MYSQL_USER: pocuser
      MYSQL_PASSWORD: pocpass

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
